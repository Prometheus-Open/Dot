<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" rx="28" fill="#0D0B0A"/>
  <!-- Left Clock Card -->
  <rect x="24" y="24" width="460" height="492" rx="32" fill="#1A1613" stroke="#3D3630" stroke-width="1.5"/>
  <!-- Glyph Ring -->
  <circle cx="254" cy="270" r="175" fill="none" stroke="#3A3A3A" stroke-width="4" stroke-dasharray="4 14"/>
  <path d="M 254 95 A 175 175 0 1 1 110 370" fill="none" stroke="#FF3C3C" stroke-width="5" stroke-dasharray="4 14"/>
  <!-- PM Badge -->
  <rect x="228" y="160" width="52" height="24" rx="6" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
  <text x="254" y="176" fill="#B8B8B8" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="2">PM</text>
  <!-- NDot Time 21:18 -->
  <text x="254" y="292" fill="#F5EDE3" font-family="monospace" font-size="88" font-weight="bold" text-anchor="middle" letter-spacing="4">21:18</text>
  <text x="254" y="346" fill="#FF3C3C" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">· 42</text>

  <!-- Right Top Date Card -->
  <rect x="504" y="24" width="380" height="360" rx="28" fill="#1A1613" stroke="#3D3630" stroke-width="1.5"/>
  <rect x="532" y="56" width="180" height="24" rx="6" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
  <text x="622" y="72" fill="#B8B8B8" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="1.5">THURSDAY, NOV 26</text>
  <text x="532" y="190" fill="#F5EDE3" font-family="monospace" font-size="96" font-weight="bold">26</text>
  <text x="532" y="232" fill="#BFAFA0" font-family="monospace" font-size="16" letter-spacing="2">NOVEMBER  2026</text>
  <!-- Day Progress Glyph Strip -->
  <line x1="532" y1="290" x2="800" y2="290" stroke="#FF3C3C" stroke-width="6" stroke-dasharray="4 8"/>
  <line x1="800" y1="290" x2="856" y2="290" stroke="#3A3A3A" stroke-width="6" stroke-dasharray="4 8"/>
  <text x="532" y="316" fill="#7A6D63" font-family="monospace" font-size="11" letter-spacing="1.5">DAY PROGRESS</text>

  <!-- World Clock Tiles -->
  <rect x="504" y="402" width="118" height="114" rx="20" fill="#1A1613" stroke="#3D3630" stroke-width="1.5"/>
  <text x="522" y="442" fill="#7A6D63" font-family="monospace" font-size="11">NEW YORK</text>
  <text x="522" y="478" fill="#F5EDE3" font-family="monospace" font-size="22" font-weight="bold">15:18</text>

  <rect x="635" y="402" width="118" height="114" rx="20" fill="#1A1613" stroke="#3D3630" stroke-width="1.5"/>
  <text x="653" y="442" fill="#7A6D63" font-family="monospace" font-size="11">LONDON</text>
  <text x="653" y="478" fill="#F5EDE3" font-family="monospace" font-size="22" font-weight="bold">20:18</text>

  <rect x="766" y="402" width="118" height="114" rx="20" fill="#1A1613" stroke="#3D3630" stroke-width="1.5"/>
  <text x="784" y="442" fill="#7A6D63" font-family="monospace" font-size="11">TOKYO</text>
  <text x="784" y="478" fill="#F5EDE3" font-family="monospace" font-size="22" font-weight="bold">05:18</text>

  <!-- Floating Pill Sidebar -->
  <rect x="898" y="196" width="52" height="148" rx="26" fill="#0F0F0F" stroke="#3A3A3A" stroke-width="1.5"/>
  <rect x="904" y="206" width="40" height="52" rx="14" fill="#FF3C3C"/>
  <circle cx="924" cy="232" r="9" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="904" y="282" width="40" height="52" rx="14" fill="none" stroke="#3A3A3A" stroke-width="1"/>
  <circle cx="924" cy="308" r="8" fill="none" stroke="#707070" stroke-width="2"/>
</svg>
